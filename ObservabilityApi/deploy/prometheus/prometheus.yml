global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Application metrics, exported by the API over OTLP and exposed by the Collector's Prometheus exporter.
  - job_name: otel-collector
    # Keep the job/instance labels the Collector derives from service.name/service.instance.id,
    # so queries can filter on job="observability-api".
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
